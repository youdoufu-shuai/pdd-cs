<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PDD 客服登录同步</title>
<style>
  :root{color-scheme:light;--navy:#102a43;--blue:#1d4ed8;--line:#e3e8ef;--muted:#667085;--bg:#f7f9fc;--ok:#0f8a5f;--bad:#b42318}
  *{box-sizing:border-box}
  body{margin:0;width:360px;background:var(--bg);color:var(--navy);font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .head{background:linear-gradient(135deg,#0b1f38,#123b66);color:#fff;padding:14px 16px 12px}
  .head h1{margin:0;font-size:15px;letter-spacing:.2px}
  .head p{margin:4px 0 0;color:#c8d8ee;font-size:11.5px}
  .body{padding:12px 14px 14px}
  label{display:block;margin:9px 0 4px;color:var(--muted);font-size:11.5px}
  input{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 9px;font-size:12.5px;color:var(--navy);background:#fff;outline:none}
  input:focus{border-color:#94b4f5;box-shadow:0 0 0 3px rgba(29,78,216,.08)}
  .row{display:flex;gap:8px;margin-top:12px}
  button{flex:1;border:0;border-radius:6px;padding:9px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
  button.primary{background:var(--blue);color:#fff}
  button.primary:hover{background:#1741b6}
  button.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
  .hint{margin-top:10px;color:var(--muted);font-size:11.5px;line-height:1.65}
  .status{margin-top:10px;padding:9px 10px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--muted);min-height:36px}
  .status.ok{color:var(--ok);border-color:#bfe3d1;background:#f1fbf6}
  .status.bad{color:var(--bad);border-color:#f3cfcb;background:#fff4f3}
  .foot{margin-top:10px;color:#98a2b3;font-size:11px;line-height:1.6}
  code{background:#eef2f7;padding:1px 4px;border-radius:3px;font-size:11px}
</style>
</head>
<body>
  <div class="head">
    <h1>PDD 客服登录同步</h1>
    <p>把当前浏览器登录的店铺同步到私有客服面板</p>
  </div>
  <div class="body">
    <label>面板地址</label>
    <input id="serverUrl" placeholder="https://youdoufu.xyz:38618"/>
    <label>面板访问令牌</label>
    <input id="token" type="password" placeholder="服务器访问令牌"/>
    <label>店铺 ID</label>
    <input id="shopId" placeholder="1"/>
    <div class="row">
      <button class="primary" id="syncBtn">立即同步</button>
      <button class="ghost" id="saveBtn">保存配置</button>
    </div>
    <div id="status" class="status">请先登录绿逸服饰旗舰店的后台，再点同步。</div>
    <div class="hint">
      扩展会读取 <code>pinduoduo.com</code> 下的登录 Cookie，并发送到你自己的面板。
      面板会校验当前登录态是否属于目标店铺，油豆腐的登录态不会误导入绿逸。
    </div>
    <div class="foot">Cookie 只在本机浏览器与你的面板之间传输，不上传第三方。</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
