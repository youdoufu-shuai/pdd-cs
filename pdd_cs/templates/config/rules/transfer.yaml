# =============================================================================
# 转人工关键词
# -----------------------------------------------------------------------------
# 命中任意一条即转人工（在关键词回复之前判断），可覆盖默认转人工词库。
# reason 会写入日志与面板，便于复盘为什么转人工。
# =============================================================================

- keywords: 人工|转人工|真人|人工客服|客服人工
  reason: 客户明确要求人工
  match: fuzzy

- keywords: 负责人|店长|经理|老板
  reason: 客户要求找负责人
  match: fuzzy

- keywords: 投诉|举报|12315|工商局|市监局|消协|消费者协会
  reason: 投诉/监管渠道
  match: fuzzy

- keywords: 起诉|律师|法院|报警|媒体|曝光|黑猫
  reason: 法律/舆情风险
  match: fuzzy

- keywords: 退款|退货|换货|仅退款|售后|赔付|赔偿|补偿
  reason: 售后处理需人工
  match: fuzzy

- keywords: 发票|开票|税号|抬头
  reason: 发票信息需人工核对
  match: fuzzy

- keywords: 改地址|修改地址|换地址|改收货地址|地址错了
  reason: 改地址需人工确认订单状态
  match: fuzzy

- keywords: 质量问题|假货|破损|坏了|漏发|错发|少发|发错
  reason: 商品/发货异常需人工核实
  match: fuzzy

- keywords: 过敏|受伤|异物|食品安全|中毒|漏电|起火
  reason: 涉及人身安全，必须人工
  match: fuzzy

- keywords: 差评|给差评|一星
  reason: 差评风险，需人工安抚
  match: fuzzy

- keywords: 便宜点|优惠点|少点|讲价|最低多少钱|能给什么价
  reason: 价格谈判需人工
  match: fuzzy
