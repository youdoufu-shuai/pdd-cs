# =============================================================================
# 平台规则合规词表（出站检查）
# -----------------------------------------------------------------------------
# 规则依据与生效日期见 docs/platform-rules.md。平台规则会更新，词表可按实际调整。
#
# severity:
#   block    直接拦截该回复（引擎会改用兜底话术并转人工）
#   rewrite  尝试按 rewrite_map 改写后发送
#   warn     只记录，不改写不拦截
# =============================================================================

# --- 站外导流 ---------------------------------------------------------------
offsite:
  - pattern: 微信|weixin|wechat|vx|v信|薇信|威信|加v|加V|加微
    match: fuzzy
    note: 平台禁止引导站外沟通
    severity: rewrite
    suggestion: 改为“在平台内沟通”
  - pattern: QQ|qq|扣扣|企微|企业微信
    match: fuzzy
    note: 平台禁止引导站外沟通
    severity: rewrite
  - pattern: 二维码|扫码|扫一扫
    match: fuzzy
    note: 平台禁止发送二维码导流
    severity: rewrite
  - pattern: 1[3-9]\d{9}
    match: regex
    note: 不得发送手机号
    severity: rewrite
  - pattern: https?://|www\.
    match: regex
    note: 不得发送站外链接
    severity: rewrite
  - pattern: 站外|私下交易|走线下|线下交易|脱离平台
    match: fuzzy
    note: 平台禁止站外交易
    severity: block

# --- 乱承诺（拼多多负体验高风险口径）---------------------------------------
# 依据：拼多多「负体验」判罚口径原文（2026-08 商家后台处罚详情页）：
#   “消费者咨询发货、物流问题时，商家提供不符合实际情况的信息”
promises:
  - pattern: 今天一定发|今天肯定发|今天必发|今天发|今晚发|马上发|立刻发|当天发|一定发|肯定发|保证发
    match: fuzzy
    category: 发货时效承诺
    note: 不得承诺具体发货时间；只能引用详情页公示时效
    severity: block
    suggestion: 改用“发货时效以商品详情页公示为准”
  - pattern: 明天到|今天到|一定到|肯定到|保证到|次日达|当天到|包到|三天内到|两天到|明天一定到
    match: fuzzy
    category: 物流到达承诺
    note: 物流不可控，不得承诺到达时间
    severity: block
    suggestion: 改用“到货时间以物流实际进度为准”
  - pattern: 包退|包换|包退包换|无条件退|肯定能退|保证退款|马上退款|立刻退款|给你退款|我帮你退款|帮你申请仅退款|可以仅退款|仅退款没问题|肯定给你处理
    match: fuzzy
    category: 售后承诺
    note: 售后处理以平台页面与平台判定为准，店铺无最终决定权
    severity: block
    suggestion: 改用“售后按平台页面流程处理，我帮您转人工”
  - pattern: 赔你|补偿你|赔付你|三倍赔偿|十倍赔偿|假一赔十|一定赔
    match: fuzzy
    category: 赔付承诺
    note: 不得承诺赔付金额与结果
    severity: block
  - pattern: 平台规定可以|平台让我|平台要求我|我能让平台|平台说了算|我说了算
    match: fuzzy
    category: 平台规则冒充
    note: 不得冒充平台或声称能影响平台判定
    severity: block

# --- 拼多多敏感 / 违禁词（会被平台拦截）------------------------------------
sensitive:
  - pattern: 链接
    match: fuzzy
    note: 拼多多实测发送会被拦截（2026-08 一线实测），自动改为“页面”
    severity: rewrite
  - pattern: 专业人员
    match: fuzzy
    note: 拼多多实测发送会被拦截（2026-08 一线实测），自动改为“售后同事”
    severity: rewrite
  - pattern: 好评返现|返现|刷单|刷信誉|补单
    match: fuzzy
    note: 诱导好评 / 刷单违规
    severity: block
  - pattern: 私下交易|转账|发红包
    match: fuzzy
    note: 站外交易风险
    severity: block

# --- 绝对化用语 / 违规宣称 ---------------------------------------------------
absolute:
  - pattern: 最好|第一|全网最低|最低价|史上
    match: fuzzy
    note: 绝对化用语，违反广告法风险
    severity: rewrite
  - pattern: 100%|百分百
    match: fuzzy
    note: 绝对化承诺
    severity: rewrite
  - pattern: 保证|绝对|肯定
    match: fuzzy
    note: 绝对化承诺（会按替换词处理）
    severity: rewrite

# --- 隐私索取 ---------------------------------------------------------------
privacy:
  - pattern: 身份证|身份证号
    match: fuzzy
    note: 不得索要身份证信息
    severity: block
  - pattern: 银行卡|卡号|验证码|密码
    match: fuzzy
    note: 不得索要支付/验证类敏感信息
    severity: block

# --- 明确禁止的内容 ---------------------------------------------------------
blocked:
  - pattern: 加微信|加个微信
    match: fuzzy
    note: 导流站外
    severity: block
  - pattern: 好评返现
    match: fuzzy
    note: 诱导好评违规
    severity: block

# --- 自动改写表（在敏感词替换时使用，长词放前面）----------------------------
rewrite_map:
  加微信: 在平台内联系
  微信: 平台消息
  二维码: 图片
  私聊: 在这里沟通
  链接: 页面
  专业人员: 售后同事
  100%: 尽可能
  百分百: 尽可能
  保证: 尽量
  绝对: 比较
  肯定: 应该
  全网最低: 活动价
  最好的: 比较合适的

# --- 兜底话术（风险内容无法改写时使用）--------------------------------------
fallbacks:
  promise: 具体时效和售后处理以商品详情页与平台页面为准，我帮您转人工确认一下～
  offsite: 咱们在平台内沟通就可以，有问题我都能帮您跟进～
  sensitive: 您的问题我已经记录，我帮您转人工客服跟进一下～
  send_rejected: 您好，您的问题已收到，我帮您转人工客服跟进，请稍等～
