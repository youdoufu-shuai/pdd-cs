# 客户黑名单（静默名单）
# -----------------------------------------------------------------------------
# 命中以下任一条的客户消息不会自动回复（可直接人工处理），适用于：
#   - 职业打假 / 恶意骚扰客户；
#   - 已明确要求人工、不再希望机器人打扰的老客户；
#   - 明显广告/招商账号（也可用 filters.yaml 过滤）。
#
# 字段：
#   uid     买家 uid（在面板「会话详情」里可以看到）
#   keyword 消息关键词（命中即静默）
#   note    备注（会显示在风控日志里）
#   enabled 是否启用
# -----------------------------------------------------------------------------

# - uid: "123456789"
#   note: 职业打假，转人工处理
#
# - keyword: 律师函
#   note: 涉及法律函件，静默并转人工
